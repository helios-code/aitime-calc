<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="How much human progress did that AI release actually compress? aitime-calc converts calendar time into human-equivalent years." />
    <title>aitime-calc — human-equivalent time</title>

    <!-- Static fallback OG/Twitter tags: unfurl bots (Twitter/Slack/FB) fetch this
         initial HTML and never run web/src JS, so these are what actually renders
         for the bare landing. Per-result tags are layered on top client-side
         (see src/lib/headMeta.ts) for humans-with-JS and JS-executing crawlers,
         but this static fallback is the one that matters for unfurls. %VITE_API_URL%
         is substituted at build time by Vite from the same env var web/src/lib/api.ts
         reads (see vercel.json / deploy config). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="aitime-calc" />
    <meta property="og:title" content="aitime-calc — human-equivalent time" />
    <meta property="og:description" content="How much human progress did that AI release actually compress? aitime-calc converts calendar time into human-equivalent years." />
    <meta property="og:image" content="%VITE_API_URL%/api/og?tool=cursor-yolo&amp;model=base" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="aitime-calc — human-equivalent time" />
    <meta name="twitter:description" content="How much human progress did that AI release actually compress? aitime-calc converts calendar time into human-equivalent years." />
    <meta name="twitter:image" content="%VITE_API_URL%/api/og?tool=cursor-yolo&amp;model=base" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
